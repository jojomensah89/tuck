<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuck Island</title>
    <link rel="icon" type="image/svg+xml" href="/tuck.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="island-container">
      <div
        id="isl"
        class="island"
        data-state="idle"
        data-shape="notch"
        tabindex="0"
        role="region"
        aria-label="Tuck Dynamic Island"
      >
        <div class="island-clip">
          <!-- Compact layer (Idle & Peek) -->
          <div class="compact" role="group" aria-hidden="false">
            <div class="cl" id="cl"></div>
            <div class="cc" id="cc"></div>
            <div class="cr" id="cr"></div>
          </div>

          <!-- Full layer (Open) -->
          <div class="full" aria-hidden="true" inert>
            <!-- The tab rail and one tabpanel per tab are built by src/tab-rail.ts,
                 which moves these sections into their tabs (see TABS in src/tab-nav.ts) -->
            <div class="pages-container">
              <!-- Media tab: now playing -->
              <section class="page media nothing" data-page="media" aria-label="Now Playing">
                <p class="empty-line media-empty">Nothing playing</p>
                <div class="now">
                  <div class="art" id="art" aria-label="Album Artwork"></div>
                  <div class="meta">
                    <div class="title" id="title"><span>Nothing playing</span></div>
                    <div class="meta-sub">
                      <div class="artist" id="artist"></div>
                      <span class="media-battery" id="mediaBattBadge"></span>
                    </div>
                  </div>
                </div>

                <div class="bar">
                  <span id="cur">00:00</span>
                  <div class="track" id="track" role="slider" aria-label="Seek track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                    <div class="fill" id="fill"></div>
                  </div>
                  <span id="left">-00:00</span>
                </div>

                <div class="ctl">
                  <button id="prev" aria-label="Previous Track"></button>
                  <button class="big" id="play" aria-label="Play"></button>
                  <button id="next" aria-label="Next Track"></button>
                </div>
              </section>

              <!-- Today tab: clock and battery -->
              <section class="page today" data-page="today" aria-label="Today and Battery">
                <div class="clock-col">
                  <div class="clock" id="clock">12:00</div>
                  <div class="date" id="date">Monday, 1 January</div>
                </div>
                <div class="batt" id="batt" role="img" aria-label="Battery">
                  <div class="ring-face batt-face" id="battFace">
                    <span class="ring-glyph batt-center">
                      <span class="batt-bolt" id="battBolt" hidden></span>
                      <span class="batt-pct" id="pct">–</span>
                    </span>
                  </div>
                  <div class="batt-sub" id="battSub"></div>
                </div>
              </section>

              <!-- Today tab: timer and pomodoro -->
              <section class="page activities" data-page="activities" aria-label="Live Activities">
                <div class="act-presets" role="group" aria-label="Timer presets">
                  <button class="act-chip" id="actQuick5" data-minutes="5" aria-label="Start a 5 minute timer" title="5 minute timer">5</button>
                  <button class="act-chip" id="actQuick15" data-minutes="15" aria-label="Start a 15 minute timer" title="15 minute timer">15</button>
                  <button class="act-chip" id="actQuick25" data-minutes="25" aria-label="Start a 25 minute focus session" title="25 minute focus (pomodoro)">25</button>
                </div>
                <div class="ring-face act-face" id="actFace" role="timer" aria-live="off">
                  <span class="ring-glyph act-center">
                    <span class="act-digits" id="actDigits">05:00</span>
                    <span class="act-label">
                      <span class="status-dot" id="actStatus" data-status="ready" role="img" aria-label="Ready" title="Ready"></span>
                      <span class="act-title" id="actTitle">Timer</span>
                    </span>
                  </span>
                </div>
                <div class="act-controls" role="group" aria-label="Timer controls">
                  <button class="icon-btn primary" id="actPause" aria-label="Start" title="Start"></button>
                  <button class="icon-btn" id="actStopwatch" aria-label="Start stopwatch" title="Stopwatch"></button>
                  <button class="icon-btn" id="actReset" aria-label="Reset" title="Reset"></button>
                </div>
              </section>

              <!-- Usage tab: AI usage meters -->
              <section class="page usage" data-page="usage" aria-label="AI Usage Meters">
                <button class="icon-btn" id="usageRefresh" data-section-actions="usage" aria-label="Refresh AI usage" title="Refresh AI usage"></button>
                <div class="u-list" id="uList"></div>
              </section>

            </div>
          </div>

          <!-- Level feedback on the open island; the status region below speaks it -->
          <div id="openAnnouncement" class="open-announcement" aria-hidden="true"></div>
          <div class="level-strip" id="levelStrip" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <div id="statusMessage" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
