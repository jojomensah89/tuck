name: Feature request
description: Feature request for Tuck
body:
  - type: textarea
    id: version
    attributes:
      label: Tuck version
    validations:
      required: true
  - type: textarea
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce or proposed workflow
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Problem this would solve
    validations:
      required: true
