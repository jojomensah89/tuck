name: Release

# One build, then a separate publish of exactly that build:
#   check    tests the commit
#   build    bumps the version in a local commit, builds and signs it, uploads the result.
#            Holds the signing key, cannot write to the repository.
#   publish  drafts the release with those files, pushes the commit and tag together, then
#            publishes. Can write to the repository, has no signing key, runs no dependencies.
#
# LIVE is true only for a push to main, or a manual run on main with dry_run off.
# Everything else, on any branch, stops after the build job.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign, then upload the result here. No push, no tag, no release.
        type: boolean
        default: true

# A dry run has its own group: a new pending run replaces an older pending one in its group,
# so sharing one would let a rehearsal drop a waiting release.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && 'release' || 'release-dry-run' }}
  cancel-in-progress: false

permissions: {}

env:
  LIVE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  build:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      live: ${{ steps.mode.outputs.live }}
      should_release: ${{ steps.metadata.outputs.should_release }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Record run mode
        id: mode
        shell: bash
        run: |
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "Live release: $LIVE"

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: src-tauri
          # whisper-rs-sys does not rebuild when GGML_NATIVE changes, so no other job's cache
          key: avx2-baseline

      - name: Prepare local speech build tools
        shell: pwsh
        run: |
          python -m pip install libclang==18.1.1
          $clangPath = python -c "import clang, pathlib; print(pathlib.Path(clang.__file__).parent / 'native')"
          "LIBCLANG_PATH=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A local tag that this job has no permission to push. It only gives a rehearsal on a
      # branch the range a real release would use, before the real baseline tag exists.
      - name: Dry run baseline
        if: env.LIVE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(bun -p "require('./package.json').version")
          if ! git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            git tag "v$version" "$(git merge-base HEAD origin/main)"
            echo "Dry run: local baseline tag v$version at $(git rev-parse --short "v$version")"
          fi

      - name: Calculate version and changelog
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          current=$(bash scripts/release-steps.sh is-current "$GITHUB_REF_NAME" "$GITHUB_SHA")
          if [ "$current" != "true" ]; then
            echo "::notice::$GITHUB_REF_NAME moved past $GITHUB_SHA. The run for the newer commit releases everything since the last tag."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun run scripts/release-metadata.ts --apply --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Commit the version bump locally
        if: steps.metadata.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: bash scripts/release-steps.sh commit-bump "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/release-assets"

      - name: Build and sign
        if: steps.metadata.outputs.should_release == 'true'
        run: bun run tauri build
        env:
          # A fixed CPU target: AVX2, without AVX-512. See verify-cpu-baseline.
          GGML_NATIVE: "OFF"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Confirm the release commit is what was built
        if: steps.metadata.outputs.should_release == 'true'
        shell: bash
        run: bash scripts/release-steps.sh verify-clean

      - name: Confirm the CPU baseline
        if: steps.metadata.outputs.should_release == 'true'
        shell: bash
        run: bash scripts/release-steps.sh verify-cpu-baseline

      - name: Verify the signature and write latest.json
        if: steps.metadata.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bun run scripts/release-assets.ts --version "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --out "$RUNNER_TEMP/release-assets"
          echo "Would release v$VERSION"
          cat "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-assets/latest.json"
          ls -l "$RUNNER_TEMP/release-assets"

      - name: Keep the build for publishing and review
        if: steps.metadata.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.live == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_LIVE: ${{ needs.build.outputs.live }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Runs every time, so a re-run or the next merge finishes a release that was left as a draft
      - name: Finish a release left as a draft
        run: bash scripts/release-steps.sh finish-pending

      - name: Download the build
        if: needs.build.outputs.should_release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Publish
        if: needs.build.outputs.should_release == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/release-steps.sh publish "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/release-assets"
