[package]
name = "tuck"
version = "0.3.1"
description = "A desktop island for Windows media controls, dictation, and local tools."
authors = ["Tuck contributors"]
license = "MIT"
repository = "https://github.com/jojomensah89/tuck"
homepage = "https://github.com/jojomensah89/tuck"
edition = "2021"

[lib]
name = "tuck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18.1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
unicode-normalization = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-dialog = "2"
sha2 = "0.10"
crossbeam-channel = "0.5"
zeroize = "1.8"
cpal = "0.16"
whisper-rs = "0.16"
transcribe-cpp = { git = 'https://github.com/anomalyco/transcribe.cpp', rev = '2778ae4bf5ca5f394d129a39467f4ad9552dc34f' }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
drag = "=2.1.1"
windows-core = "0.58"
webview2-com = "0.39"
webview-core = { package = "windows-core", version = "0.62" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "implement",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Rpc",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Wmi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_UI_Shell",
  "Win32_UI_Input",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[patch.crates-io]
transcribe-cpp-sys = { git = 'https://github.com/anomalyco/transcribe.cpp', rev = '2778ae4bf5ca5f394d129a39467f4ad9552dc34f' }
