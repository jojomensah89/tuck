[env]
GGML_NATIVE = { value = "OFF", force = true }
TRANSCRIBE_CMAKE_ARGS = { value = "-DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF", force = true }

# Catalog GGUF uses Q8_0; retain Whisper-compatible Q5_0 shaders.
CMAKE_ARGS = "-DGGML_VULKAN_SHADER_TYPES=f32,f16,q8_0,q5_0 -DGGML_VULKAN_MUL_MAT_ID=OFF"
