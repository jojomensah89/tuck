name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare local speech build tools
        shell: pwsh
        run: |
          python -m pip install libclang==18.1.1
          $clangPath = python -c "import clang, pathlib; print(pathlib.Path(clang.__file__).parent / 'native')"
          "LIBCLANG_PATH=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bun run test:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Required Windows model symlink assertions
        run: cargo test --manifest-path src-tauri/Cargo.toml dictation::model::tests::local_huggingface_links_work_and_network_links_are_rejected -- --ignored --exact --nocapture
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
