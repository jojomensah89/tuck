<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuck Island</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="island-container">
      <div
        id="isl"
        class="island"
        data-state="idle"
        data-shape="notch"
        tabindex="0"
        role="region"
        aria-label="Tuck Dynamic Island"
      >
        <div class="island-clip">
          <!-- Compact layer (Idle & Peek) -->
          <div class="compact" role="group" aria-hidden="false">
            <div class="cl" id="cl"></div>
            <div class="cc" id="cc"></div>
            <div class="cr" id="cr"></div>
          </div>

          <!-- Full layer (Open) -->
          <div class="full" aria-hidden="true" inert>
            <!-- The tab rail and one tabpanel per tab are built by src/tab-rail.ts,
                 which moves these sections into their tabs (see TABS in src/tab-nav.ts) -->
            <div class="pages-container">
              <!-- Media tab: now playing -->
              <section class="page media" data-page="media" aria-label="Now Playing">
                <div class="now">
                  <div class="art" id="art" aria-label="Album Artwork"></div>
                  <div class="meta">
                    <span class="media-battery" id="mediaBattBadge"></span>
                    <div class="title" id="title"><span>Nothing playing</span></div>
                    <div class="artist" id="artist">Play something in any app</div>
                  </div>
                </div>

                <div class="bar">
                  <span id="cur">00:00</span>
                  <div class="track" id="track" role="slider" aria-label="Seek track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                    <div class="fill" id="fill"></div>
                  </div>
                  <span id="left">-00:00</span>
                </div>

                <div class="ctl">
                  <button id="prev" aria-label="Previous Track"></button>
                  <button class="big" id="play" aria-label="Play"></button>
                  <button id="next" aria-label="Next Track"></button>
                </div>
              </section>

              <!-- Today tab: clock and battery -->
              <section class="page today" data-page="today" aria-label="Today and Battery">
                <div class="clock-col">
                  <div class="clock" id="clock">12:00</div>
                  <div class="date" id="date">Monday, 1 January</div>
                </div>
                <div class="batt">
                  <div class="batt-top">
                    <span id="pct">100%</span>
                  </div>
                  <div class="batt-bar">
                    <div id="battFill"></div>
                  </div>
                  <div class="batt-sub" id="battSub">AC power</div>
                </div>
              </section>

              <!-- Today tab: timer and pomodoro -->
              <section class="page activities" data-page="activities" aria-label="Live Activities">
                <div class="act-header">
                  <span class="act-title" id="actTitle">Timer &amp; Pomodoro</span>
                  <span class="act-status-pill" id="actStatus">Ready</span>
                </div>
                <div class="act-display">
                  <div class="act-digits" id="actDigits">05:00</div>
                </div>
                <div class="act-controls">
                  <button class="act-btn primary" id="actQuick5">5m</button>
                  <button class="act-btn primary" id="actQuick15">15m</button>
                  <button class="act-btn primary" id="actQuick25">25m Focus</button>
                  <button class="act-btn" id="actStopwatch">Stopwatch</button>
                  <button class="act-btn" id="actPause">Pause</button>
                  <button class="act-btn warn" id="actReset">Reset</button>
                </div>
              </section>

              <!-- Usage tab: AI usage meters -->
              <section class="page usage" data-page="usage" aria-label="AI Usage Meters">
                <div class="u-list" id="uList"></div>
              </section>

              <!-- Tools tab: quick actions -->
              <section class="page quick" data-page="quick" aria-label="Quick Actions">
                <div class="quick-grid">
                  <button class="chip" id="chipWifi" data-action="wifi" aria-label="Wi-Fi Settings">
                    <span id="icoWifi"></span>
                    <span>Wi-Fi</span>
                  </button>
                  <button class="chip" id="chipBt" data-action="bluetooth" aria-label="Bluetooth Settings">
                    <span id="icoBt"></span>
                    <span>Bluetooth</span>
                  </button>
                  <button class="chip" id="chipFocus" data-action="focus" aria-label="Focus Assist Settings">
                    <span id="icoFocus"></span>
                    <span>Focus</span>
                  </button>
                  <button class="chip" id="chipCapture" data-action="capture" aria-label="Screen Snip">
                    <span id="icoCapture"></span>
                    <span>Snip</span>
                  </button>
                </div>
                <div class="quick-footnote">
                  <span>Windows settings and screen snip</span>
                  &middot;
                  <button id="openSettingsBtn" style="text-decoration: underline; color: var(--ink-2);">Tuck settings</button>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="statusMessage" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
