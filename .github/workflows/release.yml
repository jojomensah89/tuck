name: Release

# Releases use a version-only PR, then build and publish the merged main commit.
# No release job pushes a commit to protected main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign without creating a PR, tag or release
        type: boolean
        default: true

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Plan release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LIVE: "true"
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/release-plan.json"
          bun run scripts/release-plan.ts --json > "$plan_file"
          action=$(jq -r .action "$plan_file")
          current=$(jq -r .currentVersion "$plan_file")
          case "$action" in
            build)
              bun run scripts/release-plan.ts --validate-current "$current"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "version=$current" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            none)
              echo "No release needed: $(jq -r .reason "$plan_file")"
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "version=$current" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            prepare) ;;
            *) echo "::error::Unknown release plan action: $action"; exit 1 ;;
          esac
          notes_file="$RUNNER_TEMP/release-notes.md"
          bun run scripts/release-plan.ts --apply --notes-file "$notes_file"
          source_sha="$GITHUB_SHA"
          version=$(bun -p "require('./package.json').version")
          bash scripts/release-steps.sh prepare-pr "$version" "$source_sha" "$notes_file" "$RUNNER_TEMP/release-assets"
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  build:
    if: always() && needs.check.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.build == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || needs.prepare.outputs.build == 'true')))
    needs: [prepare, check]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: src-tauri
          key: avx2-baseline
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'SPIRV headers installation failed' }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare local speech build tools
        shell: pwsh
        run: |
          python -m pip install libclang==18.1.1
          $clangPath = python -c "import clang, pathlib; print(pathlib.Path(clang.__file__).parent / 'native')"
          "LIBCLANG_PATH=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Read merged version and notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(bun -p "require('./package.json').version")
          latest=$(git tag --list 'v[0-9]*' --merged HEAD --sort=-v:refname | head -n1)
          if [ "${latest#v}" = "$version" ] && [ "$RELEASE_DRY_RUN" != "true" ]; then
            echo '::error::Main version is already tagged; merge the version PR before a live build.'
            exit 1
          fi
          bun run scripts/release-plan.ts --validate-current "$version"
          bash scripts/release-steps.sh current-notes "$version" "$RUNNER_TEMP/release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and sign
        run: bun run tauri build
        env:
          GGML_NATIVE: "OFF"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Confirm CPU baseline
        shell: bash
        run: bash scripts/release-steps.sh verify-cpu-baseline
      - name: Confirm build did not modify tracked files
        shell: bash
        run: bash scripts/release-steps.sh verify-clean
      - name: Verify signature and write latest.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun run scripts/release-assets.ts --version "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --out "$RUNNER_TEMP/release-assets"
      - name: Package unsigned MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_STORE_NAME: ${{ vars.MSIX_STORE_NAME }}
        run: ./scripts/package-msix.ps1 -OutputDirectory "$env:RUNNER_TEMP/release-assets"
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 14

  recover:
    if: always() && needs.prepare.result == 'success' && needs.check.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_LIVE: "true"
    steps:
      - name: Checkout main for recovery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Finish an older tagged draft without a new build
        run: bash scripts/release-steps.sh finish-pending

  publish:
    if: always() && needs.build.result == 'success' && needs.recover.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    needs: [build, recover]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_LIVE: "true"
    steps:
      - name: Checkout merged main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Publish signed release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/release-steps.sh publish "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/release-assets"
